const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

  if(products.length){const r=await sb.from('product_categories').select('product_id,category_id').in('product_id',products.map(p=>p.id));if(!r.error)(r.data||[]).forEach(x=>(productCategoryMap[x.product_id]??=[]).push(x.category_id));products.forEach(p=>{if(!productCategoryMap[p.id]?.length&&p.category_id)productCategoryMap[p.id]=[p.category_id]});}
  const ids=[...new Set([...products.map(p=>p.seller_id),...activeSellers.map(x=>x.id)])];sellers={};images=[];
  if(ids.length){const r=await sb.from('profiles').select('id,name,whatsapp,role,status').in('id',ids);if(!r.error)(r.data||[]).forEach(x=>sellers[x.id]=x)}
  if(products.length){const r=await sb.from('product_images').select('id,product_id,storage_path,position').in('product_id',products.map(p=>p.id)).order('position');if(!r.error){images=r.data||[];images.forEach(x=>x.url=sb.storage.from('product-images').getPublicUrl(x.storage_path).data.publicUrl)}}
  if(session)await loadDbCart();else cart=guestCart();await loadFavorites();
}

async function requestCategory(){if(profile?.role!=='seller')return;const name=$('sellerCatName')?.value.trim();if(!name)return toast('Informe o nome da categoria.');const slug=slugify(name);if(!slug)return toast('Nome de categoria inválido.');const r=await sb.from('category_requests').insert({user_id:profile.id,name,slug});if(r.error)return toast(r.error.message.includes('duplicate')?'Você já solicitou esta categoria.':r.error.message);toast('Solicitação enviada à Gestão.');render()}
async function reviewCategoryRequest(id,approve){const r=await sb.rpc('review_category_request',{p_request_id:id,p_approve:approve});if(r.error)return toast(r.error.message);await refresh();toast(approve?'Categoria aprovada.':'Solicitação de categoria recusada.')}
async function saveCategory(){if(profile?.role!=='admin')return;const name=$('adminCatName')?.value.trim();if(!name)return toast('Informe o nome da categoria.');const slug=slugify(name);if(!slug)return toast('Nome inválido.');const r=await sb.from('categories').insert({name,slug,active:true});if(r.error)return toast(r.error.message);await refresh();state.adminTab='categories';render();toast('Categoria criada.')}
async function renameCategory(id){if(profile?.role!=='admin')return;const c=categories.find(x=>x.id===id);const name=prompt('Novo nome da categoria:',c?.name||'');if(!name?.trim())return;const slug=slugify(name);const r=await sb.from('categories').update({name:name.trim(),slug}).eq('id',id);if(r.error)return toast(r.error.message);await refresh();state.adminTab='categories';render();toast('Categoria renomeada.')}
async function toggleCategory(id,active){if(profile?.role!=='admin')return;const r=await sb.from('categories').update({active}).eq('id',id);if(r.error)return toast(r.error.message);await refresh();state.adminTab='categories';render();toast(active?'Categoria ativada.':'Categoria desativada.')}
async function deleteCategory(id){if(profile?.role!=='admin')return;if(!confirm('Excluir esta categoria? Só é permitido quando nenhum produto a utiliza.'))return;const r=await sb.rpc('admin_delete_category',{p_category_id:id});if(r.error)return toast(r.error.message);await refresh();state.adminTab='categories';render();toast('Categoria excluída.')}
async function quickStock(id,delta){if(profile?.role!=='seller')return;const p=getProduct(id);if(!p||p.seller_id!==profile.id)return;const stock=Math.max(0,p.stock+delta);const r=await sb.from('products').update({stock}).eq('id',id);if(r.error)return toast(r.error.message);await refresh();state.page='seller';render()}

function openAuth(mode='login'){state.authMode=mode;state.modal='auth';render()}
function switchAuthMode(mode){state.authMode=mode;state.modal='auth';render();setTimeout(()=>{const el=mode==='signup'?document.getElementById('authName'):document.getElementById('authEmail');if(el)el.focus()},0)}
async function submitAuth(){
 const email=$('authEmail')?.value.trim().toLowerCase(),pass=$('authPass')?.value||'';
 if(!email||!pass)return toast('Informe e-mail e senha.');
 if(state.authMode==='signup'){
  const name=$('authName')?.value.trim()||email.split('@')[0],wa=$('authWa')?.value.trim()||'';
  if(pass.length<6)return toast('Use uma senha com pelo menos 6 caracteres.');
  const r=await sb.auth.signUp({email,password:pass,options:{data:{name,whatsapp:wa},emailRedirectTo:APP_URL}});
  if(r.error){ return toast(authEmailError(r.error)); }
  state.modal=null;
  if(r.data.session){session=r.data.session;await loadProfile();await refresh();toast('Conta criada e conectada.');}
  else {state.authMode='resend';state.modal='auth';render();toast('Conta criada. Confirme o e-mail para entrar.');}
 } else {
  const r=await sb.auth.signInWithPassword({email,password:pass});
  if(r.error){
   if(/email not confirmed/i.test(r.error.message)){state.authMode='resend';render();return toast('E-mail ainda não confirmado.');}
   return toast(r.error.message);
  }
  session=r.data.session;await loadProfile();state.modal=null;await refresh();toast('Login realizado.');
 }
}
async function resendConfirmation(){const email=$('authEmail')?.value.trim().toLowerCase();if(!email)return toast('Informe o e-mail.');const r=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:APP_URL}});if(r.error)return toast(authEmailError(r.error,'Não foi possível reenviar a confirmação.'));toast('Novo e-mail de confirmação enviado. Verifique também Spam, Promoções e Lixeira.');}
async function sendRecovery(){const email=$('authEmail')?.value.trim().toLowerCase();if(!email)return toast('Informe o e-mail.');const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:APP_URL});if(r.error)return toast(authEmailError(r.error,'Não foi possível solicitar a recuperação.'));state.modal=null;render();toast('Se o e-mail existir, a recuperação foi enviada. Verifique também Spam, Promoções e Lixeira.');}
async function loadProfile(){if(!session){profile=null;return}const r=await sb.from('profiles').select('id,name,whatsapp,role,status,created_at').eq('id',session.user.id).single();if(r.error){console.error(r.error);profile=null}else profile=r.data}
async function logout(){await sb.auth.signOut();session=null;profile=null;cart=[];saveGuestCart();go('home');toast('Sessão encerrada.')}
async function saveProfile(){const name=$('accName')?.value.trim(),whatsapp=$('accWa')?.value.trim();if(!name)return toast('Informe seu nome.');const r=await sb.from('profiles').update({name,whatsapp}).eq('id',profile.id);if(r.error)return toast(r.error.message);await loadProfile();await refresh();editingProfile=false;toast('Perfil salvo.')}
async function requestSeller(){if(profile?.role!=='client')return;const r=await sb.from('seller_requests').insert({user_id:profile.id});if(r.error)return toast(r.error.message.includes('duplicate')?'Sua solicitação já está pendente.':r.error.message);toast('Solicitação enviada à Gestão.');render()}
async function reviewRequest(id,approve){const r=await sb.rpc('review_seller_request',{p_request_id:id,p_approve:approve});if(r.error){console.error('review_seller_request',r.error);return toast(approve?'Não foi possível aprovar o vendedor.':'Não foi possível recusar a solicitação.')}await loadProfile();await refresh();toast(approve?'Vendedor aprovado com sucesso.':'Solicitação recusada.')}
async function toggleUser(id,status){const r=await sb.from('profiles').update({status}).eq('id',id);if(r.error)return toast(r.error.message);await refresh();toast(status==='active'?'Usuário reativado.':'Usuário suspenso.')}

async function toggleFeatured(id,enabled){if(profile?.role!=='admin')return;const r=await sb.from('products').update({featured:enabled}).eq('id',id);if(r.error)return toast(r.error.message);await refresh();toast(enabled?'Produto destacado na página inicial.':'Destaque removido.')}
async function validateCartGroup(sid){const items=groupCart()[sid]||[];if(!items.length)return false;const ids=items.map(o=>o.p.id);const r=await sb.from('products').select('id,name,stock,active,publication_status').in('id',ids);if(r.error){toast('Não foi possível verificar o estoque agora.');return false}const bad=(r.data||[]).some(f=>{const it=items.find(o=>o.p.id===f.id);return !it||f.publication_status!=='published'||!f.active||f.stock<it.x.quantity});if(bad){await loadAll();render();toast('A sacola foi atualizada: há produto sem estoque suficiente.');return false}return true}
async function deleteUser(id){if(!confirm('Excluir este usuário e os dados vinculados?'))return;const r=await sb.rpc('admin_delete_user',{p_user_id:id});if(r.error)return toast(r.error.message);await refresh();toast('Usuário excluído.')}
async function saveProduct(id){
 if(profile?.role!=='seller'&&profile?.role!=='admin')return toast('Sem permissão.');
 const name=$('pfName')?.value.trim(),selectedCats=[...document.querySelectorAll('input[name="pfCats"]:checked')].map(x=>x.value),price=Number($('pfPrice')?.value),saleRaw=$('pfSalePrice')?.value.trim(),sale_price=saleRaw?Number(saleRaw):null,stock=Number($('pfStock')?.value),description=$('pfDesc')?.value.trim()||'',ddd=$('pfDdd')?.value.replace(/\D/g,'')||'',phone=$('pfWa')?.value.replace(/\D/g,'')||'',whatsapp=ddd+phone,publication_status=$('pfPublication')?.value||'draft',sellerId=profile?.role==='admin'?($('pfSeller')?.value||''):profile.id;
 const hasImage=!!($('pfImage')?.files?.[0])||!!(id&&images.some(x=>x.product_id===id));
 if(!sellerId)return toast('Selecione o vendedor responsável.');if(!name)return toast('Informe o nome do produto.');if(!selectedCats.length)return toast('Selecione pelo menos uma categoria.');if(!Number.isFinite(price)||price<=0)return toast('Informe um preço original válido.');if(saleRaw!==''&&(!Number.isFinite(sale_price)||sale_price<=0||sale_price>price))return toast('O preço com desconto deve ser maior que 0 e menor ou igual ao preço original.');if(!Number.isInteger(stock)||stock<0||(!id&&stock<1))return toast(id?'O estoque não pode ser negativo.':'O estoque inicial deve ser de pelo menos 1 unidade.');if(!hasImage)return toast('Adicione uma imagem do produto.');if(!/^\d{2}$/.test(ddd))return toast('Informe um DDD com 2 dígitos.');if(!/^\d{8,9}$/.test(phone))return toast('Informe um número de WhatsApp válido.');if(!['published','hidden','draft'].includes(publication_status))return toast('Escolha uma situação de publicação válida.');
 let pid=id;const payload={category_id:selectedCats[0],name,price,sale_price,discount_percent:sale_price?Math.round(((price-sale_price)/price)*10000)/100:0,stock,description,whatsapp,publication_status};
 if(id){const old=getProduct(id);if(!old)return toast('Produto não encontrado.');if(profile.role!=='admin'&&old.seller_id!==profile.id)return toast('Sem permissão.');const r=await sb.from('products').update(payload).eq('id',id);if(r.error)return toast(r.error.message)}else{payload.seller_id=sellerId;payload.featured=profile?.role==='admin'&&$('pfFeatured')?.value==='true';const r=await sb.from('products').insert(payload).select('id').single();if(r.error)return toast(r.error.message);pid=r.data.id}
 if(profile?.role==='admin'&&id){const fr=await sb.from('products').update({featured:$('pfFeatured')?.value==='true'}).eq('id',id);if(fr.error)return toast(fr.error.message)}
 const rollbackProduct=async(msg,path)=>{if(path)await sb.storage.from('product-images').remove([path]);await sb.from('products').delete().eq('id',pid);return toast(msg)};const previousCats=id?productCategoriesFor(id):[];const cr=await sb.from('product_categories').delete().eq('product_id',pid);if(cr.error)return toast('Não foi possível atualizar as categorias: '+cr.error.message);const ci=await sb.from('product_categories').insert(selectedCats.map(category_id=>({product_id:pid,category_id})));if(ci.error){if(id&&previousCats.length)await sb.from('product_categories').insert(previousCats.map(category_id=>({product_id:pid,category_id})));if(!id)await sb.from('products').delete().eq('id',pid);return toast('Não foi possível gravar as categorias: '+ci.error.message);}
 const f=$('pfImage')?.files?.[0];if(f){const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path=`${sellerId}/${pid}-${crypto.randomUUID()}.${ext}`;const up=await sb.storage.from('product-images').upload(path,f,{upsert:false,contentType:f.type||'image/jpeg'});if(up.error){if(!id)await sb.from('products').delete().eq('id',pid);return toast('Não foi possível enviar a imagem: '+up.error.message)}const im=await sb.from('product_images').insert({product_id:pid,storage_path:path,position:0});if(im.error){await sb.storage.from('product-images').remove([path]);if(!id)await sb.from('products').delete().eq('id',pid);return toast('Não foi possível registrar a imagem: '+im.error.message)}}
 state.modal=null;await refresh();toast('Produto salvo.');
}
async function deleteProduct(id){const p=getProduct(id);if(!p)return;if(profile?.role!=='admin'&&p.seller_id!==profile?.id)return toast('Sem permissão.');if(!confirm('Excluir este produto?'))return;const r=await sb.from('products').delete().eq('id',id);if(r.error)return toast(r.error.message);await refresh();toast('Produto excluído.')}
async function adminDeleteProduct(id){if(profile?.role!=='admin')return;if(!confirm('Excluir este produto?'))return;const r=await sb.from('products').delete().eq('id',id);if(r.error)return toast(r.error.message);await refresh();toast('Produto excluído.')}
async function addCart(id){const p=getProduct(id);if(!p)return toast('Produto não encontrado.');if(profile?.role==='seller'&&p?.seller_id===profile.id)return toast('Você não pode adicionar seu próprio produto à sacola.');if(!p||p.stock<1)return toast('Produto sem estoque.');const old=cart.find(x=>x.product_id===id);const qty=Number(old?.quantity||0)+1;if(qty>p.stock)return toast('Limite de estoque atingido.');if(session){const r=await sb.from('cart_items').upsert({user_id:session.user.id,product_id:id,quantity:qty},{onConflict:'user_id,product_id'});if(r.error)return toast(r.error.message)}else{if(old)old.quantity=qty;else cart.push({product_id:id,quantity:1});saveGuestCart()}await loadAll();render();toast('Adicionado à sacola.')}
async function changeQty(id,delta){const old=cart.find(x=>x.product_id===id);const p=getProduct(id);if(!old||!p)return;const qty=Number(old.quantity)+delta;if(qty>p.stock)return toast('Limite de estoque atingido.');if(session){if(qty<=0){const r=await sb.from('cart_items').delete().eq('user_id',session.user.id).eq('product_id',id);if(r.error)return toast(r.error.message)}else{const r=await sb.from('cart_items').update({quantity:qty}).eq('user_id',session.user.id).eq('product_id',id);if(r.error)return toast(r.error.message)}}else{if(qty<=0)cart=cart.filter(x=>x!==old);else old.quantity=qty;saveGuestCart()}await loadAll();render()}
function groupCart(){const g={};cart.forEach(x=>{const p=getProduct(x.product_id);if(p)(g[p.seller_id]??=[]).push({x,p})});return g}
async function openWhatsAppSeller(sid){const ok=await validateCartGroup(sid);if(!ok)return;const s=sellers[sid];const items=groupCart()[sid]||[];const contact=items[0]?.p?.whatsapp||s?.whatsapp||'';if(!contact)return toast('Este produto não possui WhatsApp de atendimento.');const lines=items.map(({x,p})=>`• ${p.name} — ${x.quantity}x — ${money(salePrice(p)*x.quantity)}`).join('\n');const total=items.reduce((a,o)=>a+salePrice(o.p)*o.x.quantity,0);const msg=`Olá, ${s.name}! Tenho interesse nestes produtos:\n\n${lines}\n\nTotal informado: ${money(total)}\n\nGostaria de combinar a compra e a entrega.`;window.open(`https://wa.me/${contact.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`,'_blank')}
function openWhatsAppSingle(id){const p=getProduct(id);if(profile?.role==='seller'&&p?.seller_id===profile.id)return toast('Você não pode comprar o próprio produto.');const s=sellers[p?.seller_id],contact=p?.whatsapp||s?.whatsapp||'';if(!contact)return toast('Este produto não possui WhatsApp de atendimento.');const msg=`Olá, ${s.name}! Tenho interesse no produto "${p.name}" por ${money(salePrice(p))}. Podemos conversar?`;window.open(`https://wa.me/${contact.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`,'_blank')}
async function postComment(pid){if(!session)return openAuth();const content=$('commentText')?.value.trim();if(!content)return toast('Escreva um comentário.');const r=await sb.from('comments').insert({product_id:pid,user_id:session.user.id,content,status:'pending'});if(r.error)return toast(r.error.message);toast('Comentário enviado. Ele aparecerá após a análise.');await openProduct(pid);render()}
async function moderateComment(id,ok){const r=ok?await sb.from('comments').update({status:'approved'}).eq('id',id):await sb.from('comments').delete().eq('id',id);if(r.error)return toast(r.error.message);await refresh();toast(ok?'Comentário aprovado.':'Comentário excluído.')}
let renderToken=0;
function render(){
  const token=++renderToken;
  saveNavigation();
  let body=state.page==='home'?home():state.page==='products'?productsPage():state.page==='detail'?detail():state.page==='cart'?cartPage():state.page==='favorites'?favoritesPage():state.page==='account'?account():state.page==='seller'?sellerPage():state.page==='admin'?adminPage():home();
  if(body instanceof Promise){
    $('app').innerHTML=header()+`<main class="container"><div class="loading">Carregando…</div></main>`;
    body.then(x=>{
      if(token!==renderToken)return;
      $('app').innerHTML=header()+`<main class="container">${x}</main><footer>Fios & Artes · Marketplace artesanal</footer>${state.modal?modal():''}`;
    }).catch(err=>{
      if(token!==renderToken)return;
      console.error('render',err);
      $('app').innerHTML=header()+`<main class="container"><div class="notice"><b>Não foi possível abrir esta tela.</b><br>${esc(err?.message||err)}</div></main><footer>Fios & Artes · Marketplace artesanal</footer>`;
    });
  }else{
    $('app').innerHTML=header()+`<main class="container">${body}</main><footer>Fios & Artes · Marketplace artesanal</footer>${state.modal?modal():''}`;
  }
}
function updateFileName(input){const el=document.getElementById('pfImageName');if(el)el.textContent=input.files?.[0]?.name||'Escolher uma imagem'}
function updateSalePreview(){const price=Number($('pfPrice')?.value||0),sale=Number($('pfSalePrice')?.value||0),el=$('pfDiscountPreview');if(!el)return;if(!sale){el.textContent='Sem desconto.';return}if(price>0&&sale>0&&sale<price)el.textContent=`Desconto aplicado: ${Math.round(((price-sale)/price)*10000)/100}%`;else el.textContent='Informe um preço menor que o preço original.';}
function formatPhoneInput(input){const digits=String(input?.value||'').replace(/\D/g,'').slice(0,9);input.value=digits.length>5?digits.slice(0,5)+'-'+digits.slice(5):digits;}
function wireProductForm(){['pfPrice','pfSalePrice'].forEach(id=>$(id)?.addEventListener('input',updateSalePreview));$('pfDdd')?.addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,2)});$('pfWa')?.addEventListener('input',e=>formatPhoneInput(e.target));updateSalePreview();}
function openProductForm(id=''){state.modal={type:'product',id};render();setTimeout(wireProductForm,0)}
async function handleRecovery(){
 const params=new URLSearchParams(location.hash.replace(/^#/,''));
 const type=params.get('type');
 if(type==='recovery'){
  const s=await sb.auth.getSession();
  if(!s.data.session)return toast('O link de recuperação expirou ou não pôde ser validado. Solicite outro.');
  session=s.data.session;
  await loadProfile();
  state.recoveryReady=true;
  state.modal='recovery';
  render();
  return;
 }
 if(type==='signup' || type==='email_change'){
  history.replaceState({},document.title,location.pathname+location.search);
  setTimeout(()=>toast(type==='signup'?'E-mail confirmado com sucesso. Agora você pode entrar.':'E-mail atualizado com sucesso.'),50);
 }
}
async function bootstrap(){
  restoreNavigation();
  const s=await sb.auth.getSession();
  session=s.data.session;
  if(session)await loadProfile();
  if(state.page==='admin'&&profile?.role!=='admin')state.page='home';
  if(state.page==='seller'&&profile?.role!=='seller')state.page='home';
  const authListener=sb.auth.onAuthStateChange((_e,sess)=>{
    setTimeout(async()=>{
      try{
        session=sess;
        if(session)await loadProfile();
        else {profile=null;favorites=[];saveGuestFavorites();}
        await refresh();
      }catch(err){console.error('auth refresh',err);}
    },0);
  });
  window.__authSubscription=authListener?.data?.subscription||null;
  await handleRecovery();
  await refresh();
}
window.go=go;window.render=render;window.openDrawer=openDrawer;window.toggleFavorite=toggleFavorite;window.favoritesPage=favoritesPage;window.requestCategory=requestCategory;window.reviewCategoryRequest=reviewCategoryRequest;window.saveCategory=saveCategory;window.renameCategory=renameCategory;window.toggleCategory=toggleCategory;window.deleteCategory=deleteCategory;window.quickStock=quickStock;window.closeDrawer=closeDrawer;window.toggleTheme=toggleTheme;window.updateFileName=updateFileName;window.searchProducts=searchProducts;window.saveNavigation=saveNavigation;window.openAuth=openAuth;window.switchAuthMode=switchAuthMode;window.submitAuth=submitAuth;window.resendConfirmation=resendConfirmation;window.sendRecovery=sendRecovery;window.logout=logout;window.saveProfile=saveProfile;window.requestSeller=requestSeller;window.reviewRequest=reviewRequest;window.toggleUser=toggleUser;window.deleteUser=deleteUser;window.openProductForm=openProductForm;window.saveProduct=saveProduct;window.deleteProduct=deleteProduct;window.adminDeleteProduct=adminDeleteProduct;window.addCart=addCart;window.changeQty=changeQty;window.openWhatsAppSeller=openWhatsAppSeller;window.openWhatsAppSingle=openWhatsAppSingle;window.postComment=postComment;window.moderateComment=moderateComment;window.openProduct=openProduct;
render();
let bootFinished=false;
const bootTimeout=setTimeout(()=>{
  if(bootFinished)return;
  console.error('Inicialização excedeu o tempo limite.');
  $('app').innerHTML=header()+`<main class="container"><div class="panel connection-error"><div class="empty"><div class="empty-icon">${icon('craft','lg')}</div><h2>A conexão está demorando</h2><p>O aplicativo não conseguiu concluir a conexão no tempo esperado. Verifique a internet e tente novamente.</p><button class="primary" onclick="location.reload()">Tentar novamente</button></div></div></main><footer>Fios & Artes · Marketplace artesanal</footer>`;
},15000);
loadSupabaseLibrary().then(()=>{initSupabase();return bootstrap()}).then(()=>{
  bootFinished=true;
  clearTimeout(bootTimeout);
}).catch(err=>{
  bootFinished=true;
  clearTimeout(bootTimeout);
  console.error(err);
  $('app').innerHTML=header()+`<main class="container"><div class="panel connection-error"><div class="empty"><div class="empty-icon">${icon('craft','lg')}</div><h2>Não foi possível iniciar a conexão</h2><p>${esc(err?.message||'Verifique a internet e tente novamente.')}</p><button class="primary" onclick="location.reload()">Tentar novamente</button></div></div></main><footer>Fios & Artes · Marketplace artesanal</footer>`;
});
