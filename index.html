const HEIC2ANY_CDNS=[

function isHeicLikeFile(file){

function loadHeic2Any(){
  if(window.heic2any)return Promise.resolve(window.heic2any);
  if(heic2anyLoaderPromise)return heic2anyLoaderPromise;
  heic2anyLoaderPromise=new Promise((resolve,reject)=>{
    let i=0,lastError=null;
    const next=()=>{
      if(window.heic2any){resolve(window.heic2any);return}
      if(i>=HEIC2ANY_CDNS.length){reject(lastError||new Error('Biblioteca HEIC indisponível.'));return}
      const src=HEIC2ANY_CDNS[i++],tag=document.createElement('script');
      let settled=false;
      const timer=setTimeout(()=>{if(settled)return;settled=true;tag.remove();lastError=new Error('Tempo esgotado ao carregar o conversor HEIC.');next()},10000);
      tag.async=true;tag.src=src;
      tag.onload=()=>{if(settled)return;settled=true;clearTimeout(timer);window.heic2any?resolve(window.heic2any):next()};
      tag.onerror=()=>{if(settled)return;settled=true;clearTimeout(timer);tag.remove();lastError=new Error('Não foi possível carregar o conversor HEIC.');next()};

let notificationChannel=null,productChannel=null;
async function subscribeNotifications(){
 if(notificationChannel){try{await sb.removeChannel(notificationChannel)}catch(err){console.error('remove notification channel',err)}notificationChannel=null;}
 if(!session)return;
 notificationChannel=sb.channel(`notifications-${session.user.id}`)
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:`user_id=eq.${session.user.id}`},payload=>{
    if(!payload?.new?.id)return;
    notifications=[payload.new,...notifications.filter(n=>n.id!==payload.new.id)].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,100);
    if(state.modal?.type!=='product')render();
    toast(payload.new.title||'Nova notificação');
  })
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'notifications',filter:`user_id=eq.${session.user.id}`},payload=>{
    if(!payload?.new?.id)return;
    notifications=notifications.map(n=>n.id===payload.new.id?payload.new:n);
    if(state.modal?.type!=='product')render();
  })
  .on('postgres_changes',{event:'DELETE',schema:'public',table:'notifications',filter:`user_id=eq.${session.user.id}`},payload=>{
    if(!payload?.old?.id)return;
    notifications=notifications.filter(n=>n.id!==payload.old.id);
    if(state.modal?.type!=='product')render();
  })
  .subscribe(status=>{if(status==='CHANNEL_ERROR')console.error('notification realtime channel error')});
}
async function subscribeProducts(){
 if(productChannel){try{await sb.removeChannel(productChannel)}catch(err){console.error('remove product channel',err)}productChannel=null;}
 productChannel=sb.channel('products-realtime')
  .on('postgres_changes',{event:'*',schema:'public',table:'products'},payload=>{
    if(!payload?.eventType)return;
    if(payload.eventType==='UPDATE'&&payload.new?.id){products=products.map(p=>p.id===payload.new.id?{...p,...payload.new}:p);if(state.modal?.type!=='product')render();return;}
    if(payload.eventType==='INSERT'&&payload.new?.id){products=[payload.new,...products.filter(p=>p.id!==payload.new.id)];if(state.modal?.type!=='product')render();return;}
    if(payload.eventType==='DELETE'&&payload.old?.id){products=products.filter(p=>p.id!==payload.old.id);if(state.modal?.type!=='product')render();}
  })
  .subscribe(status=>{if(status==='CHANNEL_ERROR')console.error('product realtime channel error')});
}

function sellerCatalogProducts(){
 const q=String(state.sellerSearch||'').trim().toLocaleLowerCase('pt-BR');
 let list=products.filter(p=>p.seller_id===profile?.id);
 if(state.sellerTab!=='all')list=list.filter(p=>publicationStatus(p)===state.sellerTab);
 if(state.sellerStockFilter==='in')list=list.filter(p=>stockCondition(p)==='ok'||stockCondition(p)==='low');
 if(state.sellerStockFilter==='low')list=list.filter(p=>stockCondition(p)==='low');
 if(state.sellerStockFilter==='out')list=list.filter(p=>stockCondition(p)==='out');
 if(state.sellerCategoryFilter!=='all')list=list.filter(p=>productCategoriesFor(p.id).includes(state.sellerCategoryFilter)||(p.category_id===state.sellerCategoryFilter));
 if(q)list=list.filter(p=>`${p.name||''} ${p.description||''}`.toLocaleLowerCase('pt-BR').includes(q));
 const numeric=(p)=>Number(salePrice(p)||0),stock=(p)=>Number(p.stock||0),date=(p)=>new Date(p.created_at||0).getTime();
 list.sort((a,b)=>{
  switch(state.sellerSort){
   case 'oldest':return date(a)-date(b);
   case 'name_asc':return String(a.name||'').localeCompare(String(b.name||''),'pt-BR',{sensitivity:'base'});
   case 'name_desc':return String(b.name||'').localeCompare(String(a.name||''),'pt-BR',{sensitivity:'base'});
   case 'price_desc':return numeric(b)-numeric(a);
   case 'price_asc':return numeric(a)-numeric(b);
   case 'stock_desc':return stock(b)-stock(a);
   case 'stock_asc':return stock(a)-stock(b);
   default:return date(b)-date(a);
  }
 });
 return list;
}

async function setSellerPublication(id,status){
 if(profile?.role!=='seller'||!['published','hidden'].includes(status))return;
 const p=getProduct(id);if(!p||p.seller_id!==profile.id)return;
 if(moderationStatus(p)!=='approved')return toast('Este produto não pode ser publicado enquanto estiver em análise ou suspenso.');
 const oldStatus=publicationStatus(p),oldActive=p.active;
 if(oldStatus===status)return;
 p.publication_status=status;p.active=status==='published';p.updated_at=new Date().toISOString();render();
 const r=await sb.from('products').update({publication_status:status,active:status==='published',updated_at:p.updated_at}).eq('id',id).eq('seller_id',profile.id);
 if(r.error){p.publication_status=oldStatus;p.active=oldActive;render();return toast('Não foi possível alterar a publicação. A alteração foi desfeita.')}
 render();toast(status==='published'?'Produto publicado.':'Produto ocultado.');
}
async function duplicateSellerProduct(id){
 if(profile?.role!=='seller')return;
 const source=getProduct(id);if(!source||source.seller_id!==profile.id)return;
 if(!confirm(`Duplicar “${source.name}” como rascunho?`))return;
 const payload={seller_id:profile.id,category_id:source.category_id,name:`${source.name} (cópia)`.slice(0,80),price:source.price,sale_price:source.sale_price,discount_percent:source.discount_percent||0,stock:source.stock,description:source.description||'',whatsapp:sellerPublicContact(profile),publication_status:'draft',active:false,featured:false,moderation_status:'approved'};
 const ins=await sb.from('products').insert(payload).select('id').single();
 if(ins.error)return toast('Não foi possível duplicar o produto: '+ins.error.message);
 const pid=ins.data.id;
 const cats=productCategoriesFor(id).length?productCategoriesFor(id):[source.category_id];
 if(cats.filter(Boolean).length){const cr=await sb.from('product_categories').insert([...new Set(cats.filter(Boolean))].map(category_id=>({product_id:pid,category_id})));if(cr.error){await sb.from('products').delete().eq('id',pid);return toast('Não foi possível duplicar as categorias do produto.')}}
 const sourceImages=images.filter(x=>x.product_id===id).sort((a,b)=>(Number(a.position)||0)-(Number(b.position)||0));
 const copied=[];
 for(let i=0;i<sourceImages.length;i++){
  const src=sourceImages[i],ext=(String(src.storage_path||'').split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase()||'jpg',dest=`${profile.id}/${pid}-${crypto.randomUUID()}.${ext}`;
  const cp=await sb.storage.from('product-images').copy(src.storage_path,dest);
  if(cp.error){for(const c of copied)await sb.storage.from('product-images').remove([c.path]);await sb.from('product_categories').delete().eq('product_id',pid);await sb.from('products').delete().eq('id',pid);return toast('Não foi possível duplicar as imagens do produto.')}
  copied.push({path:dest,row:{product_id:pid,storage_path:dest,position:i}});
 }
 if(copied.length){const ir=await sb.from('product_images').insert(copied.map(x=>x.row));if(ir.error){for(const c of copied)await sb.storage.from('product-images').remove([c.path]);await sb.from('product_categories').delete().eq('product_id',pid);await sb.from('products').delete().eq('id',pid);return toast('Não foi possível registrar as imagens da cópia.')}}
 state.sellerTab='draft';state.sellerSearch='';await refresh();toast('Produto duplicado como rascunho.');
}

function adminProductsHtml(list){

function notificationIcon(type){

 if(type==='admin_announcement'||type==='admin_seller_announcement'||type==='admin_user_message'||type==='seller_new_follower'||type==='seller_product_out_of_stock')return 'bell';

  if(!r.error){const when=new Date().toISOString();notifications=notifications.map(x=>x.id===id?{...x,read_at:when}:x);render();}
 }
 const d=n.data||{};
 if(d.product_id){
  if(profile?.role==='seller' && ['product_suspended','product_reactivated','product_review_approved','product_review_rejected','product_added_to_cart','seller_product_out_of_stock'].includes(n.type))return go('seller');
  if(profile?.role==='seller' && n.type==='seller_new_comment')return openProduct(d.product_id);

 if(profile?.role==='admin'){

}

async function quickStock(id,delta){
 if(profile?.role!=='seller')return;
 const p=getProduct(id);if(!p||p.seller_id!==profile.id)return;
 if(sellerStockPending.has(id))return;
 const before=Math.max(0,Number(p.stock)||0),next=Math.max(0,Math.min(999999,before+Number(delta||0)));
 if(next===before)return;
 sellerStockPending.add(id);
 p.stock=next;
 render();
 const r=await sb.from('products').update({stock:next,updated_at:new Date().toISOString()}).eq('id',id).eq('seller_id',profile.id);
 sellerStockPending.delete(id);
 if(r.error){p.stock=before;render();return toast('Não foi possível salvar o estoque. A alteração foi desfeita.')}
 render();
}

function openAuth(mode='login'){state.authMode=(mode==='signup'||mode==='forgot'||mode==='resend')?mode:'login';state.authUnconfirmed=false;state.modal='auth';saveNavigation();render()}

async function submitAuth(){
 const email=$('authEmail')?.value.trim().toLowerCase(),pass=$('authPass')?.value||'';
 if(!email)return toast('Informe seu e-mail.');
 if(!pass)return toast('Informe sua senha.');
 if(state.authMode==='signup'){
  const name=$('authName')?.value.trim()||'',surname=$('authSurname')?.value.trim()||'',wa=$('authWa')?.value.trim()||'',birth=$('authBirth')?.value||'',gender=$('authGender')?.value||'';
  if(!name)return toast('Informe seu nome.');
  if(!surname)return toast('Informe seu sobrenome.');
  if(!wa)return toast('Informe seu WhatsApp.');
  if(!birth)return toast('Informe sua data de nascimento.');
  if(!gender)return toast('Selecione o sexo.');
  const birthDate=new Date(`${birth}T00:00:00`),today=new Date();
  let age=today.getFullYear()-birthDate.getFullYear();
  const birthdayNotReached=(today.getMonth()<birthDate.getMonth())||(today.getMonth()===birthDate.getMonth()&&today.getDate()<birthDate.getDate());
  if(birthdayNotReached)age--;
  if(!Number.isFinite(birthDate.getTime())||age<16)return toast('É necessário ter pelo menos 16 anos para criar uma conta.');
  if(pass.length<6)return toast('Use uma senha com pelo menos 6 caracteres.');
  const r=await sb.auth.signUp({email,password:pass,options:{data:{name,whatsapp:wa,birth_date:birth,gender},emailRedirectTo:APP_URL}});
  if(r.error)return toast(authEmailError(r.error));
  state.modal=null;
  if(r.data.session){session=r.data.session;await loadProfile();await refresh();toast('Conta criada e conectada.');}
  else{state.authMode='resend';state.modal='auth';render();toast('Conta criada. Confirme o e-mail para entrar.');}
 }else{
  const r=await sb.auth.signInWithPassword({email,password:pass});
  if(r.error){if(/email not confirmed/i.test(r.error.message)){state.authMode='login';state.authUnconfirmed=true;render();return toast('E-mail ainda não confirmado. Confira sua caixa de entrada ou reenvie a confirmação.');}return toast(r.error.message);}
  session=r.data.session;await loadProfile();state.modal=null;await refresh();toast('Login realizado.');
 }
}

async function loadProfile(){
  if(!session){profile=null;return false}
  const r=await sb.from('profiles').select('id,name,surname,whatsapp,seller_display_name,seller_whatsapp,seller_description,birth_date,gender,role,status,created_at').eq('id',session.user.id).single();

function syncModalScrollLock(){
 const locked=!!state.modal;
 const root=document.documentElement,body=document.body;
 if(locked){
  if(!root.classList.contains('modal-open')){
   modalScrollY=window.scrollY||0;
   body.style.position='fixed';
   body.style.top=`-${modalScrollY}px`;
   body.style.left='0';
   body.style.right='0';
   body.style.width='100%';
  }
  root.classList.add('modal-open');
  body.classList.add('modal-open');
 }else if(root.classList.contains('modal-open')){
  root.classList.remove('modal-open');
  body.classList.remove('modal-open');
  body.style.position='';
  body.style.top='';
  body.style.left='';
  body.style.right='';
  body.style.width='';
  if(Number.isFinite(modalScrollY))window.scrollTo(0,modalScrollY);
 }

async function bootstrap(){
  restoreNavigation();
  let initialSession=null;
  const sessionResult=await sb.auth.getSession();
  initialSession=sessionResult.data.session||null;
  session=initialSession;
  if(session){const valid=await loadProfile();if(!valid){appBooting=false;return;}}
  if(state.page==='admin'&&profile?.role!=='admin')state.page='home';
  if(state.page==='seller'&&profile?.role!=='seller')state.page='home';

  // Carrega a tela restaurada antes de começar a escutar eventos de autenticação.
  // O Supabase pode emitir INITIAL_SESSION/SIGNED_IN durante a inicialização;
  // registrar o listener antes do primeiro refresh criava uma corrida de renders.
  await handleRecovery();
  await refresh();
  await subscribeNotifications();
  await subscribeProducts();
  appBooting=false;
  saveNavigation();

  const authListener=sb.auth.onAuthStateChange((event,sess)=>{
    if(appBooting)return;
    setTimeout(async()=>{
      try{
        session=sess;
        if(session){const valid=await loadProfile();if(!valid)return;}
        else {profile=null;favorites=[];saveGuestFavorites();}
        await subscribeNotifications();
        if(event==='PASSWORD_RECOVERY'){
          state.recoveryReady=true;state.accessRecovered=false;state.modal=null;state.confirmedNotice=false;
          render();
          return;
        }
        const type=new URLSearchParams(String(location.hash||'').replace(/^#/,'')).get('type');
        if(event==='SIGNED_IN' && (type==='signup'||type==='email_change')){
          await handleRecovery();
          return;
        }
        await refresh();
      }catch(err){console.error('auth refresh',err);}
    },0);
  });
  window.__authSubscription=authListener?.data?.subscription||null;
}
